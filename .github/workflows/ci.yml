name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm run fmt:check

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test

  copy:
    needs: check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Stub out claude, so nothing real is launched
        run: |
          mkdir -p /tmp/stub
          printf '#!/bin/sh\necho "CWD=$(pwd)"\necho "ARGS=$*"\n' > /tmp/stub/claude
          chmod +x /tmp/stub/claude

      - name: Copy the source into a project that has never seen this repository
        run: |
          mkdir -p /tmp/project/tools/claude-bit
          cp -R src/. /tmp/project/tools/claude-bit/
          cd /tmp/project
          npm init -y
          npm install @clack/prompts ansis

      - name: Run the copy inside a linked worktree
        run: |
          cd /tmp/project
          git init -q repo && cd repo
          git -c user.email=ci@example.com -c user.name=ci \
            -c commit.gpgsign=false commit -qm init --allow-empty
          git worktree add -q ../repo-feat -b feat/x
          cd ../repo-feat
          PATH=/tmp/stub:$PATH node /tmp/project/tools/claude-bit/cli.ts < /dev/null | tee out.txt
          grep -q "CWD=/tmp/project/repo-feat" out.txt
          grep -q -- "--name repo-feat" out.txt

      - name: Run the copy outside a repository
        run: |
          mkdir -p /tmp/scratch && cd /tmp/scratch
          PATH=/tmp/stub:$PATH node /tmp/project/tools/claude-bit/cli.ts < /dev/null | tee out.txt
          grep -q "CWD=/tmp/scratch" out.txt

      - name: Refuse to start when claude is not installed
        run: |
          cd /tmp/scratch
          node /tmp/project/tools/claude-bit/cli.ts < /dev/null 2>err.txt && exit 1
          grep -q "claude was not found on PATH" err.txt
