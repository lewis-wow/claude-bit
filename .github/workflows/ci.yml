name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm run fmt:check

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test

      - name: Build
        run: pnpm run build

      - name: Pack
        run: |
          pnpm pack --pack-destination .
          mv claude-bit-*.tgz claude-bit.tgz

      - uses: actions/upload-artifact@v7
        with:
          name: claude-bit-package
          path: claude-bit.tgz
          if-no-files-found: error

  smoke:
    needs: check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v8
        with:
          name: claude-bit-package

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Serve the artifact, so npx sees a URL and not a local path
        run: |
          python3 -m http.server 8731 --directory "$GITHUB_WORKSPACE" &
          for _ in $(seq 1 20); do
            curl -sfI http://localhost:8731/claude-bit.tgz >/dev/null && break
            sleep 0.5
          done
          curl -sfI http://localhost:8731/claude-bit.tgz >/dev/null

      - name: Stub out claude, so nothing real is launched
        run: |
          mkdir -p /tmp/stub
          printf '#!/bin/sh\necho "CWD=$(pwd)"\necho "ARGS=$*"\n' > /tmp/stub/claude
          chmod +x /tmp/stub/claude

      - name: npx the artifact outside a repository
        run: |
          mkdir -p /tmp/scratch && cd /tmp/scratch
          echo '{"command":"/tmp/stub/claude"}' > claude-bit.json
          npx -y http://localhost:8731/claude-bit.tgz < /dev/null | tee out.txt
          grep -q "CWD=/tmp/scratch" out.txt

      - name: npx the artifact inside a linked worktree
        run: |
          cd /tmp
          git init -q repo && cd repo
          git -c user.email=ci@example.com -c user.name=ci \
            -c commit.gpgsign=false commit -qm init --allow-empty
          git worktree add -q ../repo-feat -b feat/x
          echo '{"command":"/tmp/stub/claude"}' > claude-bit.json
          cd ../repo-feat
          npx -y http://localhost:8731/claude-bit.tgz < /dev/null | tee out.txt
          grep -q "CWD=/tmp/repo-feat" out.txt
          grep -q -- "--name repo-feat" out.txt

      - name: pnpm dlx the same artifact
        run: |
          cd /tmp/scratch
          pnpm dlx http://localhost:8731/claude-bit.tgz < /dev/null | tee out2.txt
          grep -q "CWD=/tmp/scratch" out2.txt
