name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      - name: Refuse a tag that disagrees with the version being published
        run: |
          tagged="${GITHUB_REF_NAME#v}"
          declared="$(node -p 'require("./package.json").version')"
          if [ "$tagged" != "$declared" ]; then
            echo "tag $GITHUB_REF_NAME wants $tagged, package.json declares $declared" >&2
            exit 1
          fi

      - name: Check
        run: pnpm run check

      - name: Pack
        run: |
          tarball="$(pnpm pack --pack-destination . | tail -1)"
          cp "$tarball" claude-bit.tgz

      - uses: softprops/action-gh-release@v3
        with:
          files: |
            *.tgz
          generate_release_notes: true
          body: |
            ```sh
            npx @lewis_wow/claude-bit
            pnpm dlx @lewis_wow/claude-bit
            ```

            Or straight from this release, pinned to this exact build:

            ```sh
            npx https://github.com/${{ github.repository }}/releases/latest/download/claude-bit.tgz
            ```

      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
